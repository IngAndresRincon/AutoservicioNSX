<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- METALES -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F7F7"/>
      <stop offset="45%" stop-color="#BEBEBE"/>
      <stop offset="100%" stop-color="#707070"/>
    </linearGradient>

    <linearGradient id="metalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8D1D8"/>
      <stop offset="100%" stop-color="#656B70"/>
    </linearGradient>

    <!-- SOMBRA -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-opacity="0.24"/>
    </filter>

  </defs>

  <style>

    :root{
      --pump-color:#FFD000;
      --pump-dark:#D89E00;
      --hose:#1E1E1E;
    }

    .pump{
      fill:var(--pump-color);
    }

    .pump-dark{
      fill:var(--pump-dark);
    }

    .hose{
      stroke:var(--hose);
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

  </style>

  <!-- ================================================= -->
  <!-- MANGUERA -->
  <!-- ================================================= -->

  <!-- Conexión REAL desde pistola -->
  <path
    d="
    M82 356
    L82 395

    C82 430 108 448 140 448

    L212 448

    C240 448 255 430 255 404

    L255 360
    "
    class="hose"
    stroke-width="28"
  />

  <!-- Brillo -->
  <path
    d="
    M72 360
    L72 392

    C72 420 94 435 122 435
    "
    stroke="#FFFFFF"
    stroke-opacity="0.10"
    stroke-width="5"
    fill="none"
    stroke-linecap="round"
  />

  <!-- ================================================= -->
  <!-- PISTOLA -->
  <!-- ================================================= -->

  <g filter="url(#shadow)">

    <!-- PICO NUEVO -->
    <path
      d="
      M84 150

      C108 130 130 104 148 74

      "
      stroke="url(#metal)"
      stroke-width="18"
      stroke-linecap="round"
      fill="none"
    />

    <!-- BOQUILLA -->
    <path
