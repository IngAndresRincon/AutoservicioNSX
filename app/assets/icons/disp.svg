      L198 58
      L188 67
      L176 56
      Z
      "
      fill="#555"
    />

    <!-- REFLEJO -->
    <path
      d="
      M150 62
      L179 39
      "
      stroke="#FFF"
      stroke-opacity="0.55"
      stroke-width="4"
