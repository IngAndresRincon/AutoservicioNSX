<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Notificación</title>
</head>
<body style="margin:0; padding:0; background-color:#f0f0f0;">

  <!-- CONTENEDOR GENERAL -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f0f0f0;">
    <tr>
      <td align="center" style="padding:40px 10px;">

        <!-- CAJA PRINCIPAL -->
        <table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
          <!-- HEADER -->
          <tr>
            <td style="background-color:#002ca9; padding:30px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>

                  <!-- TEXTO -->
                  <td width="60%" style="color:#ffffff; font-family:Arial, sans-serif;">
                    <h1 style="margin:0; font-size:36px; color:#ffffff;">Hola 👋</h1>
                    <p style="margin:10px 0 0 0; font-size:20px;">
                      <strong>Notificación Insepet</strong>
                    </p>
                  </td>

                  <!-- LOGO -->
                  <td width="40%" align="right">
                    <img
                      src="cid:logoInsepet"
                      width="180"
                      alt="Insepet"
                      style="display:block; border:0;"
                    />
                  </td>

                </tr>
              </table>
            </td>
          </tr>

          <!-- BODY -->
          <tr>
            <td style="padding:30px; font-family:Arial, sans-serif; color:#000000;">
              <h2 style="margin-top:0; color:#002ca9; font-size:24px;">
                Portal Autoservicio
              </h2>

              <hr style="border:none; border-top:1px solid #dddddd; margin:20px 0;">

              <p style="font-size:16px; line-height:24px;">
                El sistema de notificación te envía el siguiente código de verificación
                para que lo ingreses en tu portal de autoservicio:
              </p>

              <p style="font-size:22px; font-weight:bold; color:#002ca9;">
                Código: {{codigo}}
              </p>
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="background-color:#f7f7f7; padding:20px; text-align:center; font-family:Arial, sans-serif; font-size:12px; color:#666666;">
              © 2026 Insepet · Este correo fue generado automáticamente
            </td>
          </tr>


        </table>
        <!-- FIN CAJA PRINCIPAL -->

      </td>
    </tr>
  </table>

</body>
</html>
