    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autoservicio</title>
    <style>
      .boot-loading {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f3f5f3;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .boot-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(46, 158, 73, 0.2);
        border-top-color: #2e9e49;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      .boot-text {
        color: #5c6b62;
        font-size: 0.85rem;
        font-weight: 600;
      }
    </style>

      </div>

  </body>
